    <script>
        document.addEventListener("DOMContentLoaded", function () {
            const params = new URLSearchParams(window.location.search);
            const data = {
                sync_type: params.get("sync_type"),
                start_date: params.get("start_date"),
                end_date: params.get("end_date"),
                billno: params.get("billno"),
                admission_no: params.get("admission_no"),
                reference_no: params.get("reference_no"),
                dummy: params.get("dummy")
            };
    
            const status1 = document.getElementById("status1");
    
            // Spinner untuk API 1
            status1.innerHTML = `Sync Payout Doctor: Processing <span class="spinner"></span>`;
    
            fetch("https://airflow.ad.mayapadahospital.com/api/insert_payout", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            })
            .then(response => response.json())
            .then(result1 => {
                console.log("API 1 Result:", result1);
                if (result1.status === "Success") {
                    status1.innerHTML = "Sync Payout Doctor: Success!";
                    status1.classList.add("success");
                } else {
                    throw new Error("Sync Payout Doctor: Failed");
                }
            })
            .catch(err => {
                console.error("API Error:", err);
                status1.innerHTML = "Sync Payout Doctor: Failed!";
                status1.classList.add("error");
            });
        });
    </script>
